# Build ToyKernel (PR-Q1 CI)
name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: ./build.sh x86_64
      - name: Check Kernel.elf
        run: test -f Build/HAL/X86_64/Kernel.elf && ls -lh Build/HAL/X86_64/Kernel.elf
